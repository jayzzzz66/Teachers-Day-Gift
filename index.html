<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teachers' Day!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>🎓 Welcome!</h1>
        <p class="subtitle">Are you our class adviser?</p>
        
        <div class="btn-container">
            <a href="gender.html" class="btn btn-yes">YES!</a>
            <button class="btn btn-no" id="noBtn" onclick="moveButton()">NO</button>
        </div>
    </div>

    <script>
        // Fun interactive trick: moving the "NO" button if clicked
        function moveButton() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 50);
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
